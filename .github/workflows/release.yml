# =====================================================================
# 墨阅 MoRead 发布流水线：GitHub CI 打包 release APK 并发布 GitHub Release
#
# 触发方式（二选一）：
#   1) 推送版本 tag（推荐）：
#        git tag v1.0.0 && git push origin v1.0.0
#      版本号取自 tag（去掉 v 前缀）；versionCode 由 x.y.z 派生（x*10000+y*100+z）。
#   2) 手动触发：Actions 页 → Build & Publish Release → Run workflow，
#      在 version 输入框填版本号（如 1.2.0），可选填 version-code / prerelease。
#      注意：手动触发会按 version 在默认分支最新提交上自动创建 v<version> tag；
#      请在默认分支已包含该版本代码后再手动触发。
#
# Release 产物（自动发布到 GitHub Releases）：
#   - MoRead-<version>-arm64-v8a.apk   arm64 推荐包（约 0.9MB）
#   - MoRead-<version>-universal.apk   全 ABI 通用包
#   - MoRead-<version>-mapping.txt     R8 混淆映射（崩溃栈还原）
#   - SHA256SUMS-<version>.txt         SHA-256 校验和
#
# 签名（可选，正式上架用）：
#   在 Settings → Secrets and variables → Actions 配置 4 个 Secret：
#     ANDROID_SIGNING_KEYSTORE_B64      keystore 文件的 base64（单行）
#     ANDROID_SIGNING_STORE_PASSWORD    keystore 口令
#     ANDROID_SIGNING_KEY_ALIAS         签名 key 别名
#     ANDROID_SIGNING_KEY_PASSWORD      key 口令
#   配置后 release 包使用正式 keystore 签名；未配置则回退 debug 签名
#   （可安装验证、不可上架）。
# =====================================================================
name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（形如 1.2.0；留空则报错）"
        required: false
        type: string
        default: ""
      version-code:
        description: "versionCode（可选；默认由 x.y.z 派生 x*10000+y*100+z）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为预发布（Prerelease）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 正式签名 Secrets（未配置时为空字符串，Gradle 构建自动回退 debug 签名）
      SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      HAS_SIGNING: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle（依赖与 wrapper 缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号（tag 或手动输入）
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.version-code }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" ]]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_VERSION"
            [[ -n "$TAG" ]] && TAG="v${TAG#v}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::缺少版本号：请推送 v* tag，或在手动触发时填写 version 输入。"
            exit 1
          fi
          VER="${TAG#v}"
          if [[ -n "$INPUT_CODE" ]]; then
            CODE="$INPUT_CODE"
            [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "::error::version-code 必须为正整数：$CODE"; exit 1; }
          elif [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            PATCH="${PATCH%%[^0-9]*}"
            CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          else
            CODE=1
            echo "::warning::版本号 $VER 不符合 x.y.z 格式，versionCode 回退为 1（可用 version-code 输入覆盖）。"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "发布版本：$TAG（versionCode=$CODE）"

      - name: 品牌图标检查（几何硬指标 + res 与设计源一致 + manifest 入口）
        run: ./ci/check_launcher_icon.sh

      - name: 单元测试（CommonMark / fuzz / 编码 / 高亮）
        run: ./gradlew :app:testDebugUnitTest

      - name: 打包 Release APK（R8 + 资源压缩 + ABI 分包）
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: 安全红线检查（零权限 / 零网络）
        run: ./ci/check_no_network.sh

      - name: 校验正式签名（仅配置 Secrets 时）
        if: env.HAS_SIGNING == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: 整理发布产物（重命名 + SHA-256 + Release Notes）
        id: assets
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          mv "$OUT/app-arm64-v8a-release.apk" "$OUT/MoRead-$VER-arm64-v8a.apk"
          mv "$OUT/app-universal-release.apk" "$OUT/MoRead-$VER-universal.apk"
          if [[ -f "$MAPPING" ]]; then
            cp "$MAPPING" "$OUT/MoRead-$VER-mapping.txt"
          fi
          (cd "$OUT" && sha256sum MoRead-*.apk > "SHA256SUMS-$VER.txt")
          ls -lh "$OUT"
          {
            echo "## 安装包"
            echo ""
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`MoRead-$VER-arm64-v8a.apk\` | arm64 设备安装包（推荐，约 0.9MB） |"
            echo "| \`MoRead-$VER-universal.apk\` | 全 ABI 通用包 |"
            echo "| \`MoRead-$VER-mapping.txt\` | R8 混淆映射（崩溃栈还原） |"
            echo "| \`SHA256SUMS-$VER.txt\` | SHA-256 校验和 |"
            echo ""
            echo "由 GitHub Actions 自动构建：单元测试通过 → 安全红线检查（零权限/零网络）通过 → R8 release 打包。"
            echo ""
            if [[ "$HAS_SIGNING" == "true" ]]; then
              echo "签名：正式 keystore（Secrets 注入）。"
            else
              echo "签名：debug 签名（未配置 ANDROID_SIGNING_* Secrets），仅用于安装验证，不可上架。"
            fi
          } > release-body.md

      - name: 上传构建产物（Actions Artifact 备份）
        uses: actions/upload-artifact@v4
        with:
          name: moread-apks-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/release/MoRead-*.apk
            app/build/outputs/apk/release/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: 检查 Release 是否已存在（防重复发布）
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::GitHub Release $TAG 已存在，跳过发布（产物已存为 Actions Artifact）。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布 GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 墨阅 MoRead v${{ steps.version.outputs.version }}
          body_path: release-body.md
          files: |
            app/build/outputs/apk/release/MoRead-*.apk
            app/build/outputs/apk/release/MoRead-*-mapping.txt
            app/build/outputs/apk/release/SHA256SUMS-*.txt
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.version.outputs.version, '-') }}
          fail_on_unmatched_files: false
